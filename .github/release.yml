changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - invalid
      - wontfix

  categories:
    - title: 💥 Breaking changes
      labels:
        - breaking-change

    - title: 🔒 Security
      labels:
        - security

    - title: ✨ New features
      labels:
        - enhancement
        - feature

    - title: 🐛 Bug fixes
      labels:
        - bug

    - title: ⚡️ Performance
      labels:
        - performance

    - title: 📝 Documentation
      labels:
        - documentation

    - title: ⬆️ Dependencies
      labels:
        - dependencies

    - title: 🔧 Other changes
      labels:
        - '*'
